
<div class="flex">
      <!-- Panel de leyenda -->
      <div class="legend">
        <h3>Escoltas</h3>
        <ul>
          <li *ngFor="let escolta of legendData">
            <span
              class="color-box"
              [style.background]="escolta.color"
            ></span>
            {{ escolta.nombre }}
          </li>
        </ul>
      </div>

      <!-- Contenedor del mapa -->
      <div id="map" class="map"></div>
</div>
